<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>আড্ডা — Real-time Chat</title>
<script src="/socket.io/socket.io.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-deep:    #0B1520;
    --bg-panel:   #111D2C;
    --bg-card:    #172030;
    --bg-input:   #1C2A3A;
    --accent:     #F4A825;
    --accent-dim: #C4861C;
    --teal:       #1E8A91;
    --teal-soft:  #145F65;
    --text:       #EEF0F2;
    --text-muted: #7A8FA0;
    --text-faint: #3E5060;
    --green:      #2ECC71;
    --red:        #E74C3C;
    --border:     rgba(244,168,37,0.12);
    --radius:     12px;
    --radius-sm:  8px;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg-deep);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── JOIN SCREEN ── */
  #join-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: var(--bg-deep);
    position: relative;
    overflow: hidden;
  }

  .join-bg-blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.15;
    pointer-events: none;
  }
  .blob-1 { width: 500px; height: 500px; background: var(--accent); top: -100px; right: -100px; }
  .blob-2 { width: 400px; height: 400px; background: var(--teal); bottom: -80px; left: -80px; }

  .join-card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px 44px;
    width: 100%;
    max-width: 440px;
    position: relative;
    z-index: 1;
    box-shadow: 0 32px 64px rgba(0,0,0,0.5);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
  }

  .brand-icon {
    width: 44px; height: 44px;
    background: var(--accent);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }

  .brand-name {
    font-family: 'Hind Siliguri', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.5px;
  }

  .brand-tag {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 400;
    display: block;
    margin-top: -4px;
  }

  .join-title {
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
  }

  .join-sub {
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 28px;
    line-height: 1.5;
  }

  .form-group { margin-bottom: 16px; }

  .form-label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 8px;
  }

  .form-input {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 13px 16px;
    color: var(--text);
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-input:focus { border-color: var(--accent); }
  .form-input::placeholder { color: var(--text-faint); }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
    color: var(--text-faint);
    font-size: 12px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .btn {
    width: 100%;
    padding: 14px;
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
  }

  .btn-primary {
    background: var(--accent);
    color: #0B1520;
  }
  .btn-primary:hover { background: #e0991f; transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .btn-secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-secondary:disabled { opacity: 0.6; cursor: not-allowed; }

  .room-id-row {
    display: flex;
    gap: 8px;
  }
  .room-id-row .form-input { flex: 1; }
  .btn-gen {
    padding: 13px 14px;
    background: var(--teal);
    border: none;
    border-radius: var(--radius-sm);
    color: var(--text);
    cursor: pointer;
    font-size: 18px;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .btn-gen:hover { background: var(--teal-soft); }

  /* ── CHAT SCREEN ── */
  #chat-screen {
    display: none;
    height: 100vh;
    flex-direction: column;
  }

  .topbar {
    display: flex;
    align-items: center;
    padding: 0 20px;
    height: 60px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    gap: 16px;
    flex-shrink: 0;
  }

  .topbar-brand {
    font-family: 'Hind Siliguri', sans-serif;
    font-weight: 700;
    font-size: 20px;
    color: var(--accent);
    white-space: nowrap;
  }

  .topbar-room {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    flex: 1;
    min-width: 0;
    max-width: 360px;
  }
  .topbar-room-label { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
  .topbar-room-id {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    font-family: 'Courier New', monospace;
  }

  .live-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    flex-shrink: 0;
    animation: pulse-dot 2s infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { box-shadow: 0 0 0 0 rgba(46,204,113,0.6); }
    50% { box-shadow: 0 0 0 5px rgba(46,204,113,0); }
  }

  .topbar-actions {
    display: flex;
    gap: 8px;
    margin-left: auto;
  }

  .icon-btn {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .icon-btn.copied { border-color: var(--green); color: var(--green); }

  .chat-body {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  .sidebar {
    width: 220px;
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
  }

  .sidebar-section {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-faint);
    margin-bottom: 12px;
  }

  .user-list { display: flex; flex-direction: column; gap: 6px; }

  .user-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 8px;
    border-radius: 8px;
    transition: background 0.15s;
  }
  .user-item:hover { background: var(--bg-card); }

  .user-avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
    color: var(--bg-deep);
  }

  .user-name {
    font-size: 13px;
    color: var(--text);
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .user-you {
    font-size: 10px;
    color: var(--text-muted);
    margin-left: auto;
    flex-shrink: 0;
  }

  .share-card {
    margin: 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px;
  }

  .share-card-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 8px;
  }

  .share-room-id {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    font-family: 'Courier New', monospace;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    margin-bottom: 10px;
    word-break: break-all;
  }

  .share-btn {
    width: 100%;
    padding: 9px;
    background: var(--accent);
    color: #0B1520;
    border: none;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: all 0.2s;
  }
  .share-btn:hover { background: #e0991f; }
  .share-btn.copied { background: var(--green); color: #fff; }

  .messages-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg-deep);
  }

  .messages-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    scroll-behavior: smooth;
  }

  .messages-area::-webkit-scrollbar { width: 4px; }
  .messages-area::-webkit-scrollbar-track { background: transparent; }
  .messages-area::-webkit-scrollbar-thumb { background: var(--text-faint); border-radius: 4px; }

  .msg-group { margin-bottom: 12px; }

  .msg-header {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .msg-name { font-size: 13px; font-weight: 600; }
  .msg-time { font-size: 11px; color: var(--text-faint); }

  .msg-bubble {
    display: inline-block;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 4px 12px 12px 12px;
    padding: 10px 14px;
    font-size: 14px;
    line-height: 1.6;
    max-width: 70%;
    word-break: break-word;
    color: var(--text);
  }

  .msg-group.own .msg-header { flex-direction: row-reverse; }
  .msg-group.own .msg-bubble {
    background: var(--teal-soft);
    border-color: var(--teal);
    border-radius: 12px 4px 12px 12px;
    margin-left: auto;
  }
  .msg-group.own { align-items: flex-end; display: flex; flex-direction: column; }

  .msg-system {
    text-align: center;
    font-size: 12px;
    color: var(--text-faint);
    margin: 4px 0;
    font-style: italic;
  }

  .typing-indicator {
    display: none;
    padding: 0 24px 10px;
    font-size: 12px;
    color: var(--text-muted);
    height: 28px;
    align-items: center;
    gap: 6px;
  }
  .typing-indicator.visible { display: flex; }
  .typing-dots span {
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: bounce 1s infinite;
    margin: 0 1px;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-5px); }
  }

  .input-area {
    padding: 14px 20px;
    background: var(--bg-panel);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  .chat-input {
    flex: 1;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    color: var(--text);
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    outline: none;
    resize: none;
    max-height: 120px;
    line-height: 1.5;
    transition: border-color 0.2s;
  }
  .chat-input:focus { border-color: var(--accent); }
  .chat-input::placeholder { color: var(--text-faint); }

  .send-btn {
    width: 46px; height: 46px;
    background: var(--accent);
    border: none;
    border-radius: var(--radius-sm);
    color: #0B1520;
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .send-btn:hover { background: #e0991f; transform: scale(1.05); }
  .send-btn:disabled { background: var(--text-faint); cursor: not-allowed; transform: none; }

  .toast {
    position: fixed;
    bottom: 24px; right: 24px;
    background: var(--bg-card);
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 13px;
    color: var(--text);
    transform: translateY(20px);
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s;
    z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  .empty-chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-faint);
    gap: 12px;
  }
  .empty-chat .emoji { font-size: 48px; }
  .empty-chat p { font-size: 14px; }

  @media (max-width: 640px) {
    .sidebar { display: none; }
    .msg-bubble { max-width: 90%; }
    .join-card { padding: 32px 24px; margin: 16px; }
  }
</style>
</head>
<body>

<!-- ══════════ JOIN SCREEN ══════════ -->
<div id="join-screen">
  <div class="join-bg-blob blob-1"></div>
  <div class="join-bg-blob blob-2"></div>

  <div class="join-card">
    <div class="brand">
      <div class="brand-icon">💬</div>
      <div>
        <div class="brand-name">আড্ডা</div>
        <span class="brand-tag">Bangladesh Real-time Chat</span>
      </div>
    </div>

    <div class="join-title">Start a new chat</div>
    <div class="join-sub">Create a room and share the Room ID with anyone to chat instantly — no login needed.</div>

    <div class="form-group">
      <label class="form-label">Your name</label>
      <input class="form-input" id="create-name" type="text" placeholder="e.g. Rahim, Fatima..." maxlength="24" autocomplete="off">
    </div>

    <div class="form-group">
      <label class="form-label">Room ID</label>
      <div class="room-id-row">
        <input class="form-input" id="create-room" type="text" placeholder="room-id" maxlength="32" autocomplete="off">
        <button class="btn-gen" onclick="genRoom()" title="Generate random">🔀</button>
      </div>
    </div>

    <button class="btn btn-primary" id="create-btn" onclick="createRoom()">Create Room →</button>

    <div class="divider">or join existing</div>

    <div class="form-group">
      <label class="form-label">Room ID to join</label>
      <input class="form-input" id="join-room-id" type="text" placeholder="Paste the Room ID..." autocomplete="off">
    </div>
    <div class="form-group">
      <label class="form-label">Your name</label>
      <input class="form-input" id="join-name" type="text" placeholder="Your display name" maxlength="24" autocomplete="off">
    </div>

    <button class="btn btn-secondary" id="join-btn" onclick="joinRoom()">Join Room</button>
  </div>
</div>

<!-- ══════════ CHAT SCREEN ══════════ -->
<div id="chat-screen">
  <div class="topbar">
    <div class="topbar-brand">আড্ডা</div>
    <div class="topbar-room">
      <div class="live-dot"></div>
      <span class="topbar-room-label">Room:</span>
      <span class="topbar-room-id" id="topbar-room-id"></span>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="copy-link-btn" onclick="copyRoomId(this)">🔗 Share</button>
      <button class="icon-btn" onclick="leaveRoom()">← Leave</button>
    </div>
  </div>

  <div class="chat-body">
    <div class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">Online — <span id="online-count">1</span></div>
        <div class="user-list" id="user-list"></div>
      </div>
      <div class="share-card">
        <div class="share-card-title">Invite Friends</div>
        <div class="share-room-id" id="sidebar-room-id"></div>
        <button class="share-btn" id="sidebar-share-btn" onclick="copyRoomId(this)">📋 Copy Room ID</button>
      </div>
    </div>

    <div class="messages-wrap">
      <div class="messages-area" id="messages-area">
        <div class="empty-chat" id="empty-state">
          <div class="emoji">💬</div>
          <p>No messages yet — say something!</p>
        </div>
      </div>
      <div class="typing-indicator" id="typing-indicator">
        <div class="typing-dots"><span></span><span></span><span></span></div>
        <span id="typing-text"></span>
      </div>
      <div class="input-area">
        <textarea class="chat-input" id="chat-input"
          placeholder="Type a message... (Enter to send)"
          rows="1"
          onkeydown="handleKey(event)"
          oninput="handleTyping(this)"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── State ──
let myName    = '';
let roomId    = '';
let myId      = Math.random().toString(36).slice(2) + Date.now().toString(36);
let socket    = null;
let users     = {};
let typingUsers = {};
let isTyping  = false;
let typingBroadcastTimer = null;

const avatarColors = ['#F4A825','#1E8A91','#E74C3C','#9B59B6','#2ECC71','#E67E22','#3498DB','#E91E63'];

function colorFor(name) {
  let h = 0;
  for (let c of name) h += c.charCodeAt(0);
  return avatarColors[h % avatarColors.length];
}

function initials(name) {
  return name.trim().split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0,2);
}

// ── Room ID generation ──
function genRoom() {
  const words = ['dhaka','sylhet','bogra','khulna','barisal','rajshahi','rangpur','comilla','noakhali','mymensingh'];
  const w = words[Math.floor(Math.random() * words.length)];
  const n = Math.floor(Math.random() * 900 + 100);
  document.getElementById('create-room').value = `${w}-${n}`;
}

window.addEventListener('DOMContentLoaded', () => genRoom());

// ── Enter/leave ──
function createRoom() {
  const name = document.getElementById('create-name').value.trim();
  const room = document.getElementById('create-room').value.trim();
  if (!name) { showToast('⚠️ Enter your name'); return; }
  if (!room)  { showToast('⚠️ Enter a room ID'); return; }
  enterChat(name, room);
}

function joinRoom() {
  const room = document.getElementById('join-room-id').value.trim();
  const name = document.getElementById('join-name').value.trim();
  if (!room) { showToast('⚠️ Enter a Room ID'); return; }
  if (!name) { showToast('⚠️ Enter your name'); return; }
  enterChat(name, room);
}

function setLoading(loading) {
  document.getElementById('create-btn').disabled = loading;
  document.getElementById('join-btn').disabled   = loading;
  document.getElementById('create-btn').textContent = loading ? 'Connecting...' : 'Create Room →';
}

function enterChat(name, room) {
  myName = name;
  roomId = room;
  users  = {};

  setLoading(true);

  socket = io();

  socket.on('connect', () => {
    socket.emit('join', { roomId: room, userId: myId, name, color: colorFor(name) });
  });

  socket.on('connect_error', () => {
    showToast('❌ Could not connect to server');
    setLoading(false);
    socket.disconnect();
    socket = null;
  });

  // Load history from MongoDB
  socket.on('history', (messages) => {
    setLoading(false);
    document.getElementById('join-screen').style.display = 'none';
    document.getElementById('chat-screen').style.display = 'flex';
    document.getElementById('topbar-room-id').textContent = room;
    document.getElementById('sidebar-room-id').textContent = room;

    if (messages.length > 0) {
      removeEmptyState();
      messages.forEach(m => appendMessage({
        id:    m.userId,
        name:  m.name,
        color: m.color,
        text:  m.text,
        time:  new Date(m.time)
      }));
    }

    addSystemMsg(`You joined as ${name}`);
    document.getElementById('chat-input').focus();
    showToast('✅ Joined! Share Room ID: ' + room);
  });

  // Incoming message
  socket.on('message', (msg) => {
    delete typingUsers[msg.name];
    renderTyping();
    appendMessage({ ...msg, time: new Date(msg.time) });
  });

  // User events
  socket.on('user_joined', ({ name: n, color }) => {
    addSystemMsg(`${n} joined the room`);
  });

  socket.on('user_left', ({ name: n }) => {
    addSystemMsg(`${n} left the room`);
  });

  // Sync user list
  socket.on('users', (list) => {
    users = {};
    list.forEach((u, i) => {
      users[u.userId || ('u' + i)] = { name: u.name, color: u.color, isMe: u.userId === myId };
    });
    renderUsers();
  });

  // Typing
  socket.on('typing', ({ name: n }) => {
    if (n === myName) return;
    typingUsers[n] = n;
    renderTyping();
    clearTimeout(typingUsers[n + '_t']);
    typingUsers[n + '_t'] = setTimeout(() => {
      delete typingUsers[n];
      renderTyping();
    }, 3000);
  });

  socket.on('error', ({ message }) => showToast('❌ ' + message));
}

function leaveRoom() {
  if (socket) { socket.disconnect(); socket = null; }
  users = {};
  typingUsers = {};
  document.getElementById('chat-screen').style.display = 'none';
  document.getElementById('join-screen').style.display = 'flex';
  document.getElementById('messages-area').innerHTML = `
    <div class="empty-chat" id="empty-state">
      <div class="emoji">💬</div>
      <p>No messages yet — say something!</p>
    </div>`;
  setLoading(false);
}

// ── Send ──
function sendMessage() {
  const input = document.getElementById('chat-input');
  const text  = input.value.trim();
  if (!text || !socket) return;

  socket.emit('message', {
    roomId,
    userId: myId,
    name:   myName,
    color:  colorFor(myName),
    text
  });

  input.value = '';
  input.style.height = '';
  isTyping = false;
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function handleTyping(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  if (!socket) return;
  if (!isTyping) {
    isTyping = true;
    socket.emit('typing', { roomId, name: myName });
  }
  clearTimeout(typingBroadcastTimer);
  typingBroadcastTimer = setTimeout(() => { isTyping = false; }, 2500);
}

// ── Render ──
function removeEmptyState() {
  const e = document.getElementById('empty-state');
  if (e) e.remove();
}

function appendMessage(msg) {
  const area  = document.getElementById('messages-area');
  removeEmptyState();

  const isOwn = msg.id === myId;
  const div   = document.createElement('div');
  div.className = `msg-group${isOwn ? ' own' : ''}`;

  const t = msg.time instanceof Date ? msg.time : new Date(msg.time);
  const timeStr = t.toLocaleTimeString('en-BD', { hour: '2-digit', minute: '2-digit' });

  div.innerHTML = `
    <div class="msg-header">
      <span class="msg-name" style="color:${msg.color || '#F4A825'}">${escHtml(msg.name)}</span>
      <span class="msg-time">${timeStr}</span>
    </div>
    <div class="msg-bubble">${escHtml(msg.text).replace(/\n/g,'<br>')}</div>
  `;

  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function addSystemMsg(text) {
  const area = document.getElementById('messages-area');
  removeEmptyState();
  const div = document.createElement('div');
  div.className = 'msg-system';
  div.textContent = text;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function renderUsers() {
  const list = document.getElementById('user-list');
  list.innerHTML = '';
  let count = 0;
  for (const [id, u] of Object.entries(users)) {
    count++;
    const item = document.createElement('div');
    item.className = 'user-item';
    item.innerHTML = `
      <div class="user-avatar" style="background:${u.color};color:#0B1520">${initials(u.name)}</div>
      <span class="user-name">${escHtml(u.name)}</span>
      ${u.isMe ? '<span class="user-you">you</span>' : ''}
    `;
    list.appendChild(item);
  }
  document.getElementById('online-count').textContent = count;
}

function renderTyping() {
  const indicator = document.getElementById('typing-indicator');
  const typingText = document.getElementById('typing-text');
  const names = Object.keys(typingUsers).filter(k => !k.endsWith('_t'));

  if (names.length === 0) {
    indicator.classList.remove('visible');
  } else {
    indicator.classList.add('visible');
    if (names.length === 1)      typingText.textContent = `${names[0]} is typing...`;
    else if (names.length === 2) typingText.textContent = `${names[0]} and ${names[1]} are typing...`;
    else                         typingText.textContent = `${names.length} people are typing...`;
  }
}

// ── Share ──
function copyRoomId(btn) {
  navigator.clipboard.writeText(roomId).then(() => {
    const orig = btn.innerHTML;
    btn.classList.add('copied');
    btn.textContent = '✅ Copied!';
    setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = orig; }, 2000);
    showToast('📋 Room ID copied: ' + roomId);
  }).catch(() => prompt('Share this Room ID:', roomId));
}

// ── Toast ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 3200);
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
</script>
